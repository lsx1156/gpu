# Meson cross file: x86_64 PC -> aarch64 Linux (mido / Ubuntu 24.04 device sysroot)
# Mesa 24.0.5, target: turnip (Vulkan freedreno) + freedreno GL
# 镜像 cross.ps1 的 sysroot 修复：--sysroot + -isystem 多架构头 + -L slib
[binaries]
c        = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-gcc.exe'
cpp      = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-g++.exe'
ar       = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-ar.exe'
nm       = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-nm.exe'
objcopy  = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-objcopy.exe'
objdump  = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-objdump.exe'
readelf  = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-readelf.exe'
strip    = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-strip.exe'
ld       = 'D:/project/gpu/tools/bin/aarch64-none-linux-gnu-ld.exe'
pkgconfig= 'D:/project/gpu/tools/msys64/ucrt64/bin/pkgconf.exe'

[host_machine]
system    = 'linux'
cpu_family = 'aarch64'
cpu       = 'aarch64'
endian    = 'little'

[properties]
# 设备 sysroot（与 cross.ps1 一致）；多架构头文件目录需 -isystem 显式指路
sys_root = 'D:/project/gpu/sysroot'
c_args = ['--sysroot=D:/project/gpu/sysroot',
          '-isystem', 'D:/project/gpu/sysroot/usr/include/aarch64-linux-gnu',
          '-isystem', 'D:/project/gpu/sysroot/usr/include/libdrm',
          '-isystem', 'D:/project/gpu/sysroot/usr/include/drm',
          '-LD:/project/gpu/slib',
          '-fPIC']
cpp_args = ['--sysroot=D:/project/gpu/sysroot',
            '-isystem', 'D:/project/gpu/sysroot/usr/include/aarch64-linux-gnu',
            '-isystem', 'D:/project/gpu/sysroot/usr/include/libdrm',
            '-isystem', 'D:/project/gpu/sysroot/usr/include/drm',
            '-LD:/project/gpu/slib',
            '-fPIC']
c_link_args = ['--sysroot=D:/project/gpu/sysroot', '-LD:/project/gpu/slib']
cpp_link_args = ['--sysroot=D:/project/gpu/sysroot', '-LD:/project/gpu/slib']

# pkg-config: 让编译器 --sysroot 自动解析 /usr/include 等, 故不设 sysroot_dir(避免双前缀)
[built-in options]
buildtype = 'release'
b_staticpic = true